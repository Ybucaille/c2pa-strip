name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  C2PATOOL_VERSION: v0.27.22

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  e2e:
    name: end-to-end vs c2patool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Download official c2patool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "c2patool-$C2PATOOL_VERSION" -R contentauth/c2pa-rs \
            -p "c2patool-$C2PATOOL_VERSION-x86_64-unknown-linux-gnu.tar.gz" -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/c2patool-*.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/c2patool/c2patool" --version
      - name: Sign, strip, verify
        run: |
          tests/e2e/run.sh "$RUNNER_TEMP/c2patool/c2patool" target/release/c2pa-strip \
            "$RUNNER_TEMP/c2patool/sample" e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-images
          path: e2e-out/
