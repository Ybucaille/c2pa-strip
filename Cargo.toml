[package]
name = "c2pa-strip"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Detect and losslessly remove C2PA (Content Credentials) manifests from JPEG, PNG and WebP images"
license = "MIT"
repository = "https://github.com/Ybucaille/c2pa-strip"
readme = "README.md"
keywords = ["c2pa", "metadata", "jpeg", "png", "webp"]
categories = ["command-line-utilities", "multimedia::images"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
img-parts = "0.4.1"

[dev-dependencies]
tempfile = "3.27.0"
